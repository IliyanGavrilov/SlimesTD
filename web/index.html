<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slimes TD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
      }
      canvas {
        display: block;
        margin: 0 auto;
        outline: none;
      }
    </style>
    <script>
      // Browsers block the Web Audio API until the user interacts with the page,
      // so the game's audio context starts suspended and music dies instantly.
      // Wrap the AudioContext constructor to track every context the game creates,
      // then resume them all on the first user gesture.
      (function () {
        const Native = window.AudioContext || window.webkitAudioContext;
        if (!Native) return;
        const contexts = [];
        function Tracked(...args) {
          const ctx = new Native(...args);
          contexts.push(ctx);
          return ctx;
        }
        Tracked.prototype = Native.prototype;
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
        const resume = () => {
          for (const ctx of contexts) {
            if (ctx.state === "suspended") ctx.resume();
          }
        };
        for (const ev of ["pointerdown", "keydown", "touchstart"]) {
          window.addEventListener(ev, resume, { passive: true });
        }
      })();
    </script>
  </head>
  <body>
    <script type="module">
      import init from "./slimestd.js";
      // winit signals its event loop on wasm by throwing a control-flow
      // exception; swallow only that one and re-throw anything real.
      init().catch((error) => {
        if (!`${error}`.includes("Using exceptions for control flow")) {
          throw error;
        }
      });
    </script>
  </body>
</html>
