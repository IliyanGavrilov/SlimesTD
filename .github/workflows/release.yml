name: Release build

# Builds packaged game bundles (binary + assets) for Windows, Linux and macOS on
# native runners, then publishes them as a GitHub Release. Run it manually from the
# Actions tab (provide a version tag), or push a tag like `v1.0.0`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        default: v1.0.0
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bin: tower_defence_game.exe
            outbin: Slimes TD.exe
          - os: ubuntu-latest
            label: Linux
            bin: tower_defence_game
            outbin: Slimes TD
          - os: macos-latest
            label: macOS
            bin: tower_defence_game
            outbin: Slimes TD
    steps:
      - uses: actions/checkout@v4

      # Bevy needs ALSA, udev and X11 dev headers to link on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcb1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # Stage the renamed binary next to assets/. Uploaded as a folder (not a zip)
      # so the artifact downloads as a single zip, not a zip-inside-a-zip.
      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist
          cp -r assets dist/
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.outbin }}"
          find dist/assets -name README.md -delete

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: SlimesTD-${{ matrix.label }}
          path: dist/

  # The browser build, so a tagged release ships all four platforms. It's served
  # live on itch.io / Pages too; the zip is for archival / self-hosting (needs a
  # static web server - index.html won't run from a file:// double-click).
  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install -f wasm-bindgen-cli --version 0.2.108

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Generate JS bindings
        run: |
          wasm-bindgen --no-typescript --target web \
            --out-dir dist --out-name slimestd \
            target/wasm32-unknown-unknown/release/tower_defence_game.wasm

      - name: Assemble bundle
        shell: bash
        run: |
          cp web/index.html dist/
          cp -r assets dist/assets
          find dist/assets -name README.md -delete

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: SlimesTD-Web
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [build, web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Wrap each platform's files in a nicely named top folder and zip once.
      - name: Repackage bundles
        shell: bash
        run: |
          mkdir -p out
          for label in Windows Linux macOS Web; do
            src="artifacts/SlimesTD-$label"
            [ -d "$src" ] || continue
            stage="Slimes TD - $label"
            rm -rf "$stage"
            cp -r "$src" "$stage"
            # Artifacts drop the executable bit; restore it for the Linux/macOS binary.
            chmod +x "$stage/Slimes TD" 2>/dev/null || true
            zip -r "out/SlimesTD-$label.zip" "$stage" >/dev/null
          done
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: out/*.zip
          generate_release_notes: true
          body: |
            **Slimes TD** - a pixel-art tower defense game. Defend your base from 10 waves of slimes with wizard towers.

            ## ▶ Play in your browser (no download)
            - **itch.io:** https://iliyangavrilov.itch.io/slimestd
            - **GitHub Pages:** https://iliyangavrilov.github.io/SlimesTD/

            ## 💾 Downloads
            | Asset | Platform / use |
            |-------|----------------|
            | `SlimesTD-Windows.zip` | Windows - unzip, run `Slimes TD.exe` |
            | `SlimesTD-Linux.zip` | Linux - unzip, run `./"Slimes TD"` |
            | `SlimesTD-macOS.zip` | macOS - unzip, run `Slimes TD` (right-click → **Open**, unsigned) |
            | `SlimesTD-Web.zip` | Browser build for **self-hosting** - serve the unzipped folder with any static web server |

            See the [README](https://github.com/IliyanGavrilov/SlimesTD#readme) for full controls, towers, enemies and build instructions.
