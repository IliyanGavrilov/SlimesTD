name: Release build

# Builds packaged game bundles (binary + assets) for Windows, Linux and macOS on
# native runners. Run manually from the Actions tab (workflow_dispatch), or push a
# version tag like `v1.0.0` to also create a GitHub Release with the zips attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bin: tower_defence_game.exe
            outbin: Slimes TD.exe
          - os: ubuntu-latest
            label: Linux
            bin: tower_defence_game
            outbin: Slimes TD
          - os: macos-latest
            label: macOS
            bin: tower_defence_game
            outbin: Slimes TD
    steps:
      - uses: actions/checkout@v4

      # Bevy needs ALSA, udev and X11 dev headers to link on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxcb1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      # Stage "Slimes TD - <OS>/" containing the renamed binary next to assets/.
      - name: Stage package
        shell: bash
        run: |
          dir="Slimes TD - ${{ matrix.label }}"
          mkdir -p "dist/$dir"
          cp -r assets "dist/$dir/"
          cp "target/release/${{ matrix.bin }}" "dist/$dir/${{ matrix.outbin }}"
          find "dist/$dir/assets" -name README.md -delete

      - name: Zip (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r "../SlimesTD-${{ matrix.label }}.zip" "Slimes TD - ${{ matrix.label }}"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Slimes TD - ${{ matrix.label }}" -DestinationPath "SlimesTD-${{ matrix.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimesTD-${{ matrix.label }}
          path: SlimesTD-${{ matrix.label }}.zip

      # Only when triggered by a version tag: attach the zip to the GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SlimesTD-${{ matrix.label }}.zip
